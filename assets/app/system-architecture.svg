<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" role="img" aria-labelledby="title desc"><title id="title">Rice Student Media system architecture</title><desc id="desc">Five source-to-service-to-view paths in the native iOS app, followed by the AWS API, data storage, and push notification flow.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#69766f" stroke-width="1.2"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#25332d;font-size:14px} .head{font-size:12px;font-weight:600;fill:#58665e} .node{fill:#fff;stroke:#aab6ae;stroke-width:1} .client{fill:#f8fafb;stroke:#47718a} .aws{fill:#fffaf3;stroke:#b78035} .line{fill:none;stroke:#839087;stroke-width:1.1;marker-end:url(#arrow)} .minor{font-size:12px;fill:#5f6b64}</style><text x="112" y="20" text-anchor="middle" class="head">SOURCES</text><text x="420" y="20" text-anchor="middle" class="head">iOS SERVICES / ENGINES</text><text x="750" y="20" text-anchor="middle" class="head">VIEWS</text><rect class="node " x="20" y="38" width="185" height="42" rx="2"/><text x="112.5" y="63" text-anchor="middle">Newspaper CMS API</text><rect class="node client" x="275" y="38" width="290" height="42" rx="2"/><text x="420.0" y="63" text-anchor="middle">SwiftSoup + native renderer</text><rect class="node client" x="635" y="38" width="245" height="42" rx="2"/><text x="757.5" y="63" text-anchor="middle">Articles · search · saved stories</text><path class="line" d="M205 59H273"/><path class="line" d="M565 59H633"/><rect class="node " x="20" y="92" width="185" height="42" rx="2"/><text x="112.5" y="109" text-anchor="middle">KTRU</text><text x="112.5" y="125" text-anchor="middle" class="minor">WordPress + live stream</text><rect class="node client" x="275" y="92" width="290" height="42" rx="2"/><text x="420.0" y="117" text-anchor="middle">WordPress client + AVPlayer</text><rect class="node client" x="635" y="92" width="245" height="42" rx="2"/><text x="757.5" y="117" text-anchor="middle">Radio · reviews · schedule</text><path class="line" d="M205 113H273"/><path class="line" d="M565 113H633"/><rect class="node " x="20" y="146" width="185" height="42" rx="2"/><text x="112.5" y="163" text-anchor="middle">Library archives + S3</text><text x="112.5" y="179" text-anchor="middle" class="minor">via IIIF / CloudFront</text><rect class="node client" x="275" y="146" width="290" height="42" rx="2"/><text x="420.0" y="171" text-anchor="middle">Archive client + PDFKit</text><rect class="node client" x="635" y="146" width="245" height="42" rx="2"/><text x="757.5" y="171" text-anchor="middle">History · yearbooks</text><path class="line" d="M205 167H273"/><path class="line" d="M565 167H633"/><rect class="node " x="20" y="200" width="185" height="42" rx="2"/><text x="112.5" y="225" text-anchor="middle">Google Sheets + ESPN</text><rect class="node client" x="275" y="200" width="290" height="42" rx="2"/><text x="420.0" y="225" text-anchor="middle">CSV / JSON clients</text><rect class="node client" x="635" y="200" width="245" height="42" rx="2"/><text x="757.5" y="225" text-anchor="middle">Authors · sports scores</text><path class="line" d="M205 221H273"/><path class="line" d="M565 221H633"/><rect class="node aws" x="20" y="254" width="185" height="42" rx="2"/><text x="112.5" y="279" text-anchor="middle">AWS S3 puzzles</text><rect class="node client" x="275" y="254" width="290" height="42" rx="2"/><text x="420.0" y="279" text-anchor="middle">Crossword engine + UIKit input</text><rect class="node client" x="635" y="254" width="245" height="42" rx="2"/><text x="757.5" y="279" text-anchor="middle">Puzzles · leaderboard</text><path class="line" d="M205 275H273"/><path class="line" d="M565 275H633"/><path d="M20 326H880" fill="none" stroke="#d4d8d0"/><text x="20" y="351" class="head">AWS: NOTIFICATIONS, SUBSCRIPTIONS &amp; GAME DATA</text><rect